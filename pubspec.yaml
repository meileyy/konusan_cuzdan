name: konusan_cuzdan
description: "Konuşan Cüzdan - Çocuklar için sesli para hesaplama uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/voice/
    - assets/video/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
